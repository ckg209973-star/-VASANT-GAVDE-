<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VASANT GAVDE</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #000000, #1a1a1a, #000000);
    color: white;
    text-align: center;
}

/* Title */
.title {
    margin-top: 80px;
    font-size: 40px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 0 0 15px #ffffff;
}

/* Number */
.number {
    font-size: 120px;
    margin: 40px 0;
    color: #e0e0e0;
}

/* Button */
.join-btn {
    display: inline-block;
    padding: 18px 40px;
    font-size: 20px;
    color: black;
    border-radius: 50px;
    background: linear-gradient(90deg, #ffffff, #dcdcdc);
    border: 3px solid white;
    text-decoration: none;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
    transition: 0.3s;
}

.join-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(255,255,255,1);
}

/* Features */
.features {
    margin-top: 40px;
    font-size: 18px;
    line-height: 1.8;
    color: #cccccc;
}

.features span {
    display: block;
}

/* Countdown */
.countdown {
    margin-top: 30px;
    font-size: 18px;
    color: #aaaaaa;
}
</style>
</head>

<body>

<div class="title">VASANT GAVDE</div>

<div class="number">17</div>

<a href="https://t.me/+140fCOvn_1IzZmM1" class="join-btn">
    JOIN TELEGRAM CHANNEL
</a>

<div class="features">
    <span>✅ Free Access</span>
    <span>✅ IPL, T20s, World Cup</span>
    <span>✅ Join 1000s of fans who watch with clarity, not confusion</span>
</div>

<div class="countdown" id="countdown">
    Redirecting in 17 seconds...
</div>

<script>
let time = 17;
let countdownEl = document.getElementById("countdown");

let timer = setInterval(() => {
    time--;
    countdownEl.innerText = "Redirecting in " + time + " seconds...";
    
    if (time <= 0) {
        clearInterval(timer);
        window.location.href = "https://t.me/+140fCOvn_1IzZmM1";
    }
}, 1000);
</script>

</body>
</html>
