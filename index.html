<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial;
    background: radial-gradient(circle, #330000, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Box */
.container {
    width: 90%;
    max-width: 350px;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    border: 1px solid rgba(255,0,0,0.4);
    box-shadow: 0 0 30px red;
    background: linear-gradient(145deg, #1a0000, #330000);
}

/* Title */
.title {
    font-size: 28px;
    color: #ffd700;
    text-shadow: 0 0 15px #ffd700, 0 0 25px red;
}

/* Countdown Premium */
.countdown {
    font-size: 85px;
    font-weight: bold;
    color: #ffcc00;
    text-shadow: 0 0 25px #ffcc00, 0 0 50px red;
    margin: 15px 0;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

/* Progress bar */
.progress {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
}

.progress-bar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, red, yellow);
    animation: progressAnim 20s linear forwards;
}

@keyframes progressAnim {
    from { width: 100%; }
    to { width: 0%; }
}

/* Button */
.btn {
    padding: 12px 22px;
    border-radius: 50px;
    background: linear-gradient(45deg, red, yellow);
    color: #000;
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
    transform: scale(0.9);
    box-shadow: 0 0 20px red;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1);
}

/* Text */
.features {
    margin-top: 20px;
    color: #ffd700;
    text-align: left;

    </div>
</div>

<script>
let time = 20;
let el = document.getElementById("count");

let timer = setInterval(() => {
    time--;
    el.innerText = time;

    if(time <= 0){
        clearInterval(timer);
    }
}, 1000);
</script>
