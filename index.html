<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VASANT GAVDE</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #2b0000, #8b0000, #2b0000);
    color: white;
    text-align: center;
}

/* Title */
.title {
    margin-top: 80px;
    font-size: 40px;
    font-weight: bold;
    color: #ff4d4d;
    text-shadow: 0 0 20px #ff0000;
}

/* Number */
.number {
    font-size: 120px;
    margin: 40px 0;
    color: #ffd6d6;
}

/* Button */
.join-btn {
    display: inline-block;
    padding: 18px 40px;
    font-size: 20px;
    color: white;
    border-radius: 50px;
    background: linear-gradient(90deg, #ff0000, #ff4d4d);
    border: 3px solid #ffffff;
    text-decoration: none;
    box-shadow: 0 0 25px rgba(255,0,0,0.7);

    /* Zoom Animation */
    animation: zoomPulse 1.5s infinite;
}

/* Zoom Effect */
@keyframes zoomPulse {
    0% { transform: scale(1); }
    50% { transform: scale(0.92); }
    100% { transform: scale(1); }
}

.join-btn:hover {
    box-shadow: 0 0 40px rgba(255,0,0,1);
}

/* Features */
.features {
    margin-top: 40px;
    font-size: 18px;
    line-height: 1.8;
    color: #ffcccc;
}

.features span {
    display: block;
}

/* Countdown */
.countdown {
    margin-top: 30px;
    font-size: 18px;
    color: #ffb3b3;
}
</style>
</head>

<body>

<div class="title">VASANT GAVDE</div>

<div class="number" id="number">10</div>

<a href="https://t.me/+140fCOvn_1IzZmM1" class="join-btn">
    JOIN TELEGRAM CHANNEL
</a>

<div class="features">
    <span>✅ Free Access</span>
    <span>✅ IPL, T20s, World Cup</span>
    <span>✅ Join 1000s of fans who watch with clarity, not confusion</span>
</div>

<div class="countdown" id="countdown">
    Redirecting in 10 seconds...
</div>

<script>
let time = 10;
let countdownEl = document.getElementById("countdown");
let numberEl = document.getElementById("number");

let timer = setInterval(() => {
    time--;
    countdownEl.innerText = "Redirecting in " + time + " seconds...";
    numberEl.innerText = time;

    if (time <= 0) {
        clearInterval(timer);
        window.location.href = "https://t.me/+140fCOvn_1IzZmM1";
    }
}, 1000);
</script>

</body>
</html>
